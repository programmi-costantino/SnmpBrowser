# Crea installer e aggiornamenti (Velopack) quando si pubblica un tag "vX.Y.Z".
# Uso:   git tag v1.0.0 ; git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# una sola release alla volta (il runner e' persistente e le cartelle di lavoro sono condivise)
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on:
      group: "nuovoserver"
    timeout-minutes: 30
    env:
      REPO_URL: https://github.com/${{ github.repository }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Versione dal tag
        shell: powershell
        run: |
          $v = $env:TAG.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Il tag deve avere la forma vX.Y.Z (trovato: $v)" }
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$v" -Encoding ascii
          Write-Host "Versione: $v"

      - name: MinGit (git incluso nell'app, con licenza e sorgenti)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./tools/get-mingit.ps1
          if ($LASTEXITCODE -ne 0) { throw "get-mingit.ps1 fallito (codice $LASTEXITCODE)" }

      - name: Publish
        shell: powershell
        run: |
          dotnet publish SnmpBrowser.csproj -c Release -r win-x64 --self-contained "-p:Version=$env:VERSION" -o publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish fallito (codice $LASTEXITCODE)" }

      - name: Strumento Velopack (stessa versione della libreria)
        shell: powershell
        run: |
          # la cartella degli strumenti .NET potrebbe non essere nel PATH del runner
          $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
          Add-Content -Path $env:GITHUB_PATH -Value $tools -Encoding ascii
          $env:PATH = "$tools;$env:PATH"

          $lib = (Get-Item publish\Velopack.dll).VersionInfo.ProductVersion.Split('+')[0]
          Write-Host "Libreria Velopack $lib"
          dotnet tool update -g vpk --version $lib
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Versione $lib di vpk non trovata: uso l'ultima."
            dotnet tool update -g vpk
            if ($LASTEXITCODE -ne 0) { throw "installazione di vpk fallita" }
          }
          vpk -h | Select-Object -First 3

      - name: Scarica le release precedenti (servono per gli aggiornamenti differenziali)
        shell: powershell
        continue-on-error: true
        run: vpk download github --repoUrl $env:REPO_URL --token $env:GH_TOKEN

      - name: Crea installer e pacchetti
        shell: powershell
        run: |
          vpk pack --packId SnmpBrowser --packTitle "SNMP Browser" --packAuthors "programmi-costantino" --packVersion $env:VERSION --packDir publish --mainExe SnmpBrowser.exe
          if ($LASTEXITCODE -ne 0) { throw "vpk pack fallito (codice $LASTEXITCODE)" }
          Get-ChildItem Releases | Format-Table Name, Length

      - name: Pubblica su GitHub Releases
        shell: powershell
        run: |
          vpk upload github --repoUrl $env:REPO_URL --publish --releaseName "SNMP Browser $env:VERSION" --tag $env:TAG --token $env:GH_TOKEN
          if ($LASTEXITCODE -ne 0) { throw "vpk upload fallito (codice $LASTEXITCODE)" }
